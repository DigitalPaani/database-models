name: Claude AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    # Skip draft PRs
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write   # required for OIDC token exchange with the Claude app

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so Claude can diff properly

      - name: Run Claude PR Reviewer
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true   # one review comment that updates on each push
          prompt: |
            Review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or logic issues
            - Security concerns
            - Performance considerations

            Use inline comments for specific lines where helpful,
            and post a concise summary. Be constructive; don't nitpick style.