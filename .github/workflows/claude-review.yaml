name: Claude AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    # Skip draft PRs
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write   # required for OIDC token exchange with the Claude app

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so Claude can diff properly

      - name: Run Claude PR Reviewer
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true   # one review comment that updates on each push
          prompt: |
            You have two tasks for this pull request:

            1. REVIEW: Provide feedback on:
               - Code quality and best practices
               - Potential bugs or logic issues
               - Security concerns
               - Performance considerations
               Use inline comments for specific lines where helpful, and post
               a concise summary comment. Be constructive; don't nitpick style.

            2. PR DESCRIPTION: Update this PR's description using
               `gh pr edit ${{ github.event.pull_request.number }} --body "..."`.
               Write a clear description with these sections:
               ## Summary — what this PR does and why
               ## Changes — bullet list of key changes by file/area
               ## Impact — anything reviewers or deployers should know
               If the PR already has a meaningful description written by the
               author, keep it and append your generated sections below it
               under a "## AI Summary" heading instead of replacing it.
          claude_args: |
            --allowedTools "mcp__github_comment__create_comment,mcp__github_inline_comment__create_inline_comment,Bash(gh pr edit:*),Bash(gh pr view:*)"